version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    # Hold a new release back for a few days before proposing it, so a yanked
    # or compromised version is usually caught first. This is the updater-level
    # equivalent of pnpm's release-age guard, which cannot be used here because
    # it stops the lockfile from resolving.
    cooldown:
      default-days: 3
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"
    groups:
      vue-dependencies:
        patterns:
          - "vue*"
          - "@vue/*"
      babel-dependencies:
        patterns:
          - "@babel/*"
          - "babel-*"
      eslint-dependencies:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "typescript-eslint"
          - "vue-eslint-parser"

  # Enable version updates for composer
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
    labels:
      - "dependencies"
      - "php"
    commit-message:
      prefix: "chore(deps)"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(actions)"
